<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIGEPRO - Sistema Integral de Gestión de Proveedores Flota Sugamuxi S.A.</title>
    
    <!-- Favicon & Iconos Oficiales Flota Sugamuxi S.A. -->
    <link rel="icon" type="image/png" href="/logo-flota.png" />
    <link rel="shortcut icon" type="image/png" href="/logo-flota.png" />
    <link rel="apple-touch-icon" href="/logo-flota.png" />
    <meta name="theme-color" content="#0b1329" />

    <meta name="description" content="SIGEPRO: Sistema Integral de Gestión de Proveedores de Flota Sugamuxi S.A. Registro simplificado, expediente digital, gestión de formatos institucionales (FS.GA-FOR-009 y FS.GA-FOR-039), control documental, revisiones y convocatorias." />
    <meta property="og:title" content="SIGEPRO - Sistema Integral de Gestión de Proveedores Flota Sugamuxi S.A." />
    <meta property="og:description" content="SIGEPRO: Sistema Integral de Gestión de Proveedores de Flota Sugamuxi S.A. Registro simplificado, expediente digital, gestión de formatos institucionales (FS.GA-FOR-009 y FS.GA-FOR-039), control documental, revisiones y convocatorias." />
    <meta property="og:image" content="/logo-flota.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/logo-flota.png" />
    
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        background: #0b1329;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: #f8fafc;
        z-index: 99999;
        padding: 20px;
        text-align: center;
      }
      .loader-emblem-wrap {
        width: 84px;
        height: 84px;
        background: #ffffff;
        border-radius: 22px;
        padding: 10px;
        margin-bottom: 20px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .loader-emblem {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .loader-title {
        font-size: 22px;
        font-weight: 900;
        letter-spacing: -0.5px;
        margin-bottom: 4px;
        color: #ffffff;
      }
      .loader-sub {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: #38bdf8;
        margin-bottom: 24px;
      }
      .loader-bar-wrap {
        width: 180px;
        height: 4px;
        background: #1e293b;
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 12px;
      }
      .loader-bar {
        width: 50%;
        height: 100%;
        background: linear-gradient(90deg, #0284c7, #38bdf8);
        border-radius: 999px;
        animation: progress 1.4s ease-in-out infinite;
      }
      .loader-text {
        font-size: 11px;
        color: #94a3b8;
      }
      @keyframes progress {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(50%); }
        100% { transform: translateX(200%); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.88; transform: scale(0.96); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="loader-emblem-wrap">
          <img class="loader-emblem" src="/logo-flota.png" alt="Flota Sugamuxi S.A." />
        </div>
        <div class="loader-title">SIGEPRO</div>
        <div class="loader-sub">Flota Sugamuxi S.A.</div>
        <div class="loader-bar-wrap">
          <div class="loader-bar"></div>
        </div>
        <div class="loader-text">Iniciando plataforma de gestión de proveedores...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
