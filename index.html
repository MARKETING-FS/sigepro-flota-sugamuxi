<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIGEPRO - Sistema Integral de Gestión de Proveedores Flota Sugamuxi S.A.</title>
    <meta name="description" content="SIGEPRO: Sistema Integral de Gestión de Proveedores de Flota Sugamuxi S.A. Registro simplificado, expediente digital, gestión de formatos institucionales (FS.GA-FOR-009 y FS.GA-FOR-039), control documental, revisiones y convocatorias." />
    <meta property="og:title" content="SIGEPRO - Sistema Integral de Gestión de Proveedores Flota Sugamuxi S.A." />
    <meta property="og:description" content="SIGEPRO: Sistema Integral de Gestión de Proveedores de Flota Sugamuxi S.A. Registro simplificado, expediente digital, gestión de formatos institucionales (FS.GA-FOR-009 y FS.GA-FOR-039), control documental, revisiones y convocatorias." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        background: #0b1329;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: #f8fafc;
        z-index: 99999;
        padding: 20px;
        text-align: center;
      }
      .loader-emblem {
        width: 68px;
        height: 68px;
        margin-bottom: 20px;
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .loader-title {
        font-size: 20px;
        font-weight: 900;
        letter-spacing: -0.5px;
        margin-bottom: 4px;
        color: #ffffff;
      }
      .loader-sub {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: #38bdf8;
        margin-bottom: 24px;
      }
      .loader-bar-wrap {
        width: 180px;
        height: 4px;
        background: #1e293b;
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 12px;
      }
      .loader-bar {
        width: 50%;
        height: 100%;
        background: linear-gradient(90deg, #0284c7, #38bdf8);
        border-radius: 999px;
        animation: progress 1.4s ease-in-out infinite;
      }
      .loader-text {
        font-size: 11px;
        color: #94a3b8;
      }
      @keyframes progress {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(50%); }
        100% { transform: translateX(200%); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(0.96); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <svg class="loader-emblem" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#38bdf8" />
              <stop offset="50%" stop-color="#0284c7" />
              <stop offset="100%" stop-color="#1e3a8a" />
            </linearGradient>
            <linearGradient id="sGrad" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#0ea5e9" />
              <stop offset="100%" stop-color="#60a5fa" />
            </linearGradient>
          </defs>
          <rect x="4" y="4" width="92" height="92" rx="22" fill="#0b1329" stroke="#1e3a8a" stroke-width="2.5" />
          <path d="M 22 28 C 42 16 68 18 84 30 C 74 34 62 33 46 36 C 34 38 27 44 22 50 C 21 42 21 34 22 28 Z" fill="url(#sGrad)" />
          <path d="M 32 30 C 36 30 40 32 40 36 L 36 74 C 36 78 32 80 28 80 C 24 80 24 76 25 72 L 30 36 C 30 32 31 30 32 30 Z" fill="url(#pGrad)" />
          <path d="M 34 46 L 56 42 C 60 41 62 43 60 47 C 58 50 55 51 51 51 L 33 55 Z" fill="url(#sGrad)" />
          <path d="M 72 40 C 66 36 58 37 54 41 C 50 45 52 50 58 53 C 68 58 74 63 70 71 C 66 79 54 82 44 79 C 39 77 36 74 35 70 C 39 71 44 71 48 70 C 56 68 60 64 61 59 C 62 55 57 52 50 48 C 42 43 42 35 48 29 C 55 23 68 24 76 30 C 76 33 74 37 72 40 Z" fill="url(#pGrad)" />
          <circle cx="74" cy="32" r="4.5" fill="#38bdf8" />
        </svg>
        <div class="loader-title">SIGEPRO</div>
        <div class="loader-sub">Flota Sugamuxi S.A.</div>
        <div class="loader-bar-wrap">
          <div class="loader-bar"></div>
        </div>
        <div class="loader-text">Iniciando plataforma de gestión de proveedores...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
